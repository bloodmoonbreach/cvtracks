# Example master file. Every fact you might ever put on a CV, written once.
# Text can be a plain string, or one string per language: {en: ..., es: ...}
# Tags decide which tracks show an item. No tags = shown everywhere.
# Priority: 1 = always first, 2 = normal, 3 = first to drop when a track has limits.

person:
  name: Alex Example
  email: alex@example.com
  phone: "+34 600 000 000"
  website: alex.example.dev
  github: alex-example
  linkedin: alex-example

summaries:
  security:
    en: >-
      Junior security analyst with a systems administration background. Hands-on with log analysis,
      alert triage and hardening in home-lab and training environments.
    es: >-
      Analista de seguridad junior con experiencia previa en administración de sistemas. Práctica en
      análisis de logs, triaje de alertas y bastionado en laboratorio propio y plataformas de formación.
  support:
    es: >-
      Técnico de soporte informático con trato directo con usuarios: incidencias de hardware, sistemas
      operativos y redes, documentadas en un sistema de tickets.
    en: >-
      IT support technician used to working with users directly: hardware, OS and network incidents,
      documented in a ticketing system.

